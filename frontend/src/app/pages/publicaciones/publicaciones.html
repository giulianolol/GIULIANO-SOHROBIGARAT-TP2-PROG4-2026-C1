<app-navbar />

<div
class="container"
appFadeIn>

  <h1>Publicaciones</h1>

  @if(errorMessage()){

    <div class="error-banner">
      ⚠️ {{ errorMessage() }}
    </div>

  }

  <div class="toolbar">

    <div class="sort-section">

      <span class="toolbar-title">
        Ordenar por
      </span>

      <button
        class="toolbar-btn"
        appHoverEffect
        [class.active]="sort === 'fecha'"
        (click)="changeSort('fecha')"
      >
        📅 Fecha
      </button>

      <button
        class="toolbar-btn"
        appHoverEffect
        [class.active]="sort === 'likes'"
        (click)="changeSort('likes')"
      >
        ❤️ Likes
      </button>

    </div>

    <button
      class="new-post-btn"
      appHoverEffect
      routerLink="/publicaciones/nueva"
    >
      ➕ Nueva publicación
    </button>

  </div>

  <hr>

  <p>

    Cantidad de publicaciones:

    {{ publicaciones().length }}

  </p>

  <div class="posts-grid">

    @for(post of publicaciones(); track post._id){

      <app-post-card
        [post]="post"
        [user]="user"
        (like)="addLike(post._id)"
        (unlike)="removeLike(post._id)"
        (delete)="deletePost(post._id)"
        (removeImage)="removeImage(post._id)"
      >
      </app-post-card>

    }

  </div>

  <div class="pagination">

    <button
      appHoverEffect
      (click)="previousPage()"
      [disabled]="offset === 0"
    >
      ← Página anterior
    </button>

    <span class="page-indicator">

      Página {{ currentPage }}

    </span>

    <button
      appHoverEffect
      (click)="nextPage()"
      [disabled]="!hasNextPage"
    >
      Página siguiente →
    </button>

  </div>

</div>
