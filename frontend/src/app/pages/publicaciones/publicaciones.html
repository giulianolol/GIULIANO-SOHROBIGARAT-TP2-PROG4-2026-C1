<app-navbar />

<div class="container">

  <h1>Publicaciones</h1>

<div class="toolbar">

  <div class="sort-section">

    <span class="toolbar-title">
      Ordenar por
    </span>

    <button
      class="toolbar-btn"
      (click)="changeSort('fecha')"
    >
      📅 Fecha
    </button>

    <button
      class="toolbar-btn"
      (click)="changeSort('likes')"
    >
      ❤️ Likes
    </button>

  </div>

  <button
    class="new-post-btn"
    routerLink="/publicaciones/nueva"
  >
    ➕ Nueva publicación
  </button>

</div>

<hr>

  <hr>

  <p>
    Cantidad de publicaciones:
    {{ publicaciones().length }}
  </p>

  <div class="posts-grid">

  @for(post of publicaciones(); track post._id){

    <app-post-card
      [post]="post"
      [user]="user"
      (like)="addLike(post._id)"
      (unlike)="removeLike(post._id)"
      (delete)="deletePost(post._id)"
      (removeImage)="removeImage(post._id)"
    >
    </app-post-card>

  }

</div>

  <div class="pagination">

    <button
      (click)="previousPage()"
      [disabled]="offset === 0"
    >
      ← Página anterior
    </button>

    <span class="page-indicator">

      Página {{ currentPage }}

    </span>

    <button
      (click)="nextPage()"
      [disabled]="!hasNextPage"
    >
      Página siguiente →
    </button>

  </div>

</div>
